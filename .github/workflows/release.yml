name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Verify tkinter
        run: python -c "import tkinter; print(tkinter.TkVersion)"

      - name: Build macOS bundle
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name nanoUno app.py

      - name: Package macOS bundle
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/nanoUno.app" "release/nanoUno-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanoUno-macos
          path: release/nanoUno-macos.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Verify tkinter
        run: python -c "import tkinter; print(tkinter.TkVersion)"

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name nanoUno app.py

      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/nanoUno.exe -DestinationPath release/nanoUno-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanoUno-windows
          path: release/nanoUno-windows.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten release files
        run: |
          mkdir -p packaged
          find release -type f -name "*.zip" -exec cp {} packaged/ \;
          ls -la packaged

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" packaged/*.zip --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" packaged/*.zip --repo "$GH_REPO" --title "$tag" --generate-notes
          fi
